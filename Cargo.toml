[package]
name = "iris-horizon"
version = "0.1.0"
edition = "2024"
authors = ["Horizon Rust Community"]
description = "High-performance Iris & OptiFine shader pack compatibility layer for Horizon (Rust/wgpu)"
license = "LGPL-3.0-or-later OR MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Horizon Engine & Mixin Integration
horizon-mixins-core = { git = "https://github.com/horizon-rust/horizon-mixins", optional = true }
horizon-render = { git = "https://github.com/horizon-rust/horizon", optional = true }

# Modern Graphics Stack (wgpu 24.x)
wgpu = { version = "24.0", features = ["naga", "spirv"] }
naga = { version = "24.0", features = ["glsl-in", "wgsl-out", "spv-out", "spv-in", "validate"] }

# Math & Byte Layout (std140 alignment)
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.18", features = ["derive"] }

# Parsing & Utility
regex = "1.11"
thiserror = "2.0"
log = "0.4"
parking_lot = "0.12"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["standalone"]
standalone = []
mixin = ["dep:horizon-mixins-core", "dep:horizon-render"]

[dev-dependencies]
env_logger = "0.11"
